<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex des Reliques — Suivi ARR → Dawntrail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1019;
  --bg-alt:#141522;
  --panel:#1B1C2C;
  --panel-2:#22233686;
  --line:#2C2D42;
  --text:#E9E6F2;
  --text-dim:#9C98B4;
  --text-faint:#6B6884;
  --crystal:#5EE6D9;
  --crystal-dim:#3A9C92;
  --gold:#E3B34D;
  --gold-dim:#8A6B2C;
  --rose:#E2637A;
  --rose-dim:#7A3540;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at 20% -10%, #1c1e33 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Cormorant Garamond',serif;}

/* Layout */
.app{display:flex;min-height:100vh;}
.rail{
  width:280px;flex:0 0 280px;
  background:var(--bg-alt);
  border-right:1px solid var(--line);
  padding:28px 18px 18px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.main{flex:1;min-width:0;padding:34px 40px 80px;max-width:920px;}

/* Brand */
.brand{padding:0 6px 22px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.brand .mark{font-size:11px;letter-spacing:.14em;color:var(--crystal);text-transform:uppercase;margin-bottom:6px;}
.brand h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;margin:0 0 4px;line-height:1.15;color:#fff;}
.brand p{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}

/* Global ring */
.global-box{
  margin:0 6px 20px;padding:16px;border-radius:var(--radius);
  background:linear-gradient(160deg,#1d2038,#171827);
  border:1px solid var(--line);
}
.global-row{display:flex;align-items:center;gap:14px;}
.ring{width:56px;height:56px;flex:0 0 56px;}
.global-num{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--crystal);}
.global-label{font-size:11px;color:var(--text-dim);line-height:1.3;}

/* Nav list */
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;}
.navlist button{
  width:100%;text-align:left;border:none;background:transparent;color:var(--text);
  padding:10px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  font-family:inherit;
}
.navlist button:hover{background:var(--panel);}
.navlist button.active{background:var(--panel);box-shadow:inset 2px 0 0 var(--crystal);}
.nav-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.nav-name{font-size:13.5px;font-weight:600;}
.nav-ext{font-size:10.5px;color:var(--text-faint);}
.nav-bar{height:4px;border-radius:3px;background:#2a2b3f;overflow:hidden;}
.nav-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--crystal-dim),var(--crystal));}
.nav-pct{font-size:10.5px;color:var(--text-dim);}

.rail-foot{margin-top:16px;padding:0 6px;}
.reset-btn{
  width:100%;font-size:11.5px;color:var(--rose);background:transparent;border:1px solid var(--rose-dim);
  border-radius:8px;padding:8px;cursor:pointer;font-family:inherit;
}
.reset-btn:hover{background:rgba(226,99,122,0.08);}
.save-indicator{font-size:10.5px;color:var(--text-faint);text-align:center;margin-top:8px;height:14px;}

/* Series header */
.series-head{margin-bottom:22px;}
.eyebrow{font-size:11px;color:var(--text-dim);letter-spacing:.03em;margin-bottom:6px;}
.series-head h2{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;margin:0 0 8px;color:#fff;}
.series-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim);margin-bottom:16px;}
.series-meta b{color:var(--text);font-weight:600;}
.target-row{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  padding:12px 14px;border-radius:var(--radius);margin-bottom:8px;
}
.target-row label{font-size:12.5px;color:var(--text-dim);}
.target-row input{
  width:64px;background:var(--bg-alt);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:6px 8px;font-family:inherit;font-size:14px;text-align:center;
}
.overall-bar{flex:1;height:8px;border-radius:5px;background:#2a2b3f;overflow:hidden;}
.overall-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--crystal-dim),var(--gold));}
.overall-pct{font-size:12.5px;color:var(--crystal);min-width:40px;text-align:right;}

/* Prereqs */
.prereqs{
  background:var(--panel-2);border:1px dashed var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:24px;font-size:12.5px;color:var(--text-dim);
}
.prereqs .lbl{color:var(--text);font-weight:600;margin-bottom:6px;font-size:12.5px;}
.prereqs ul{margin:0;padding-left:18px;}
.prereqs li{margin-bottom:3px;}

/* Timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{
  content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1px;
  background:linear-gradient(to bottom, var(--crystal-dim), var(--line));
}
.step{position:relative;margin-bottom:14px;}
.step-node{
  position:absolute;left:-26px;top:16px;width:17px;height:17px;border-radius:50%;
  background:var(--bg-alt);border:2px solid var(--line);
}
.step.ok .step-node{border-color:var(--gold);background:var(--gold);}
.step-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.step-summary{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;
}
.step-summary:hover{background:#1f2032;}
.step-title{font-size:14.5px;font-weight:600;flex:1;min-width:0;}
.step-quest{font-size:11.5px;color:var(--text-faint);display:block;margin-top:2px;font-weight:400;}
.badge{
  font-size:10.5px;padding:3px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto;
  border:1px solid var(--line);color:var(--text-dim);
}
.step.ok .badge{border-color:var(--gold-dim);color:var(--gold);background:rgba(227,179,77,0.08);}
.chevron{color:var(--text-faint);font-size:13px;transition:transform .15s ease;flex:0 0 auto;}
.step.open .chevron{transform:rotate(90deg);}
.step-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line);}
.step.open .step-body{display:block;}
.instr-list{margin:12px 0 14px;padding-left:18px;font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.instr-list li{margin-bottom:4px;}
.instr-list li::marker{color:var(--crystal-dim);}

table.mat{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
table.mat th{
  text-align:left;font-size:10.5px;color:var(--text-faint);font-weight:600;
  padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.mat td{padding:8px 8px;border-bottom:1px solid #23243a;vertical-align:middle;}
table.mat tr:last-child td{border-bottom:none;}
.mat-name{color:var(--text);font-weight:500;}
.mat-source{color:var(--text-faint);font-size:11.5px;}
.mat-num{text-align:right;color:var(--text-dim);white-space:nowrap;}
.mat-input{
  width:58px;background:var(--bg-alt);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:5px 6px;font-family:inherit;font-size:12.5px;text-align:right;
}
.mat-missing{font-weight:600;}
.mat-missing.zero{color:var(--gold);}
.mat-missing.some{color:var(--rose);}
.step-total{
  display:flex;justify-content:flex-end;gap:18px;font-size:11.5px;color:var(--text-dim);
  padding:10px 8px 2px;
}
.step-notes{margin-top:10px;font-size:11.5px;color:var(--text-faint);font-style:italic;}
.step-notes div{margin-bottom:3px;}

/* Mon suivi panel */
.suivi{
  margin-top:32px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 20px;
}
.suivi h3{font-family:'Cormorant Garamond',serif;font-size:19px;margin:0 0 4px;color:#fff;font-weight:600;}
.suivi p.hint{font-size:11.5px;color:var(--text-faint);margin:0 0 14px;}
.suivi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.suivi-field{display:flex;flex-direction:column;gap:5px;}
.suivi-field.full{grid-column:1 / -1;}
.suivi-field label{font-size:11px;color:var(--text-dim);}
.suivi-field input,.suivi-field select,.suivi-field textarea{
  background:var(--bg-alt);border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:8px 10px;font-family:inherit;font-size:12.5px;
}
.suivi-field textarea{resize:vertical;min-height:60px;}

/* Dashboard (accueil) */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
.dash-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;cursor:pointer;transition:border-color .15s;
}
.dash-card:hover{border-color:var(--crystal-dim);}
.dash-card h4{font-family:'Cormorant Garamond',serif;font-size:17px;margin:0 0 3px;color:#fff;font-weight:600;}
.dash-card .sub{font-size:11px;color:var(--text-faint);margin-bottom:10px;}
.dash-card .bar{height:6px;border-radius:4px;background:#2a2b3f;overflow:hidden;margin-bottom:6px;}
.dash-card .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--crystal-dim),var(--gold));}
.dash-card .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);}

.recap-toggle{
  margin-top:26px;font-size:12px;color:var(--crystal);cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;
}
.recap-body{display:none;margin-top:12px;}
.recap-body.open{display:block;}
.recap-table{width:100%;border-collapse:collapse;font-size:12px;}
.recap-table th{text-align:left;color:var(--text-faint);font-weight:600;font-size:10.5px;padding:6px 8px;border-bottom:1px solid var(--line);}
.recap-table td{padding:8px 8px;border-bottom:1px solid #23243a;color:var(--text-dim);}
.recap-table td.n{color:var(--text);font-weight:500;}

@media(max-width:860px){
  .app{flex-direction:column;}
  .rail{position:relative;width:100%;flex:none;height:auto;top:0;}
  .main{padding:24px 18px 60px;max-width:none;}
  .dash-grid{grid-template-columns:1fr;}
  .suivi-grid{grid-template-columns:1fr;}
}
:focus-visible{outline:2px solid var(--crystal);outline-offset:2px;}
</style>
</head>

<script>(function(){
"use strict";

const DATA = JSON.parse(document.getElementById('series-data').textContent);

const ORDER = ["Zodiaque","Anima","Eureka","Resistance","Cielacier","Manderville","Splendide","Fantôme","Cosmique"];

const META = {
  Zodiaque:   {extension:"A Realm Reborn",   type:"Combat",  diff:"Très long"},
  Anima:      {extension:"Heavensward",      type:"Combat",  diff:"Très long"},
  Eureka:     {extension:"Stormblood",       type:"Combat",  diff:"Long (zone instanciée)"},
  Resistance: {extension:"Shadowbringers",   type:"Combat",  diff:"Moyen (Bozja / Zadnor)"},
  Cielacier:  {extension:"Shadowbringers",   type:"DoH / DoL", diff:"Long (craft / gather)"},
  Manderville:{extension:"Endwalker",        type:"Combat",  diff:"Facile (Tomestones)"},
  Splendide:  {extension:"Endwalker",        type:"DoH / DoL", diff:"Long (craft / gather)"},
  "Fantôme":  {extension:"Dawntrail",        type:"Combat",  diff:"Long (Occult Crescent)"},
  Cosmique:   {extension:"Dawntrail",        type:"DoH / DoL", diff:"Moyen (Cosmic Exploration)"},
};

const STORAGE_KEY = "armes-relique-progress";

let state = { targets:{}, possede:{}, notes:{}, openSteps:{} };
let currentView = "dashboard"; // "dashboard" or a series key
let saveTimer = null;

// ---------- storage (localStorage : natif au navigateur, fonctionne en fichier local ou hébergé) ----------
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({targets:{}, possede:{}, notes:{}, openSteps:{}}, parsed);
    }
  }catch(e){ /* premier lancement : rien à charger, ou stockage indisponible (navigation privée, etc.) */ }
}

function scheduleSave(){
  clearTimeout(saveTimer);
  const ind = document.getElementById('saveIndicator');
  if(ind) ind.textContent = "Enregistrement…";
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(ind) ind.textContent = "Progrès enregistré ✓";
      setTimeout(()=>{ if(ind) ind.textContent=""; }, 1800);
    }catch(e){
      if(ind) ind.textContent = "Échec de l'enregistrement (stockage indisponible)";
    }
  }, 300);
}

function resetAll(){
  if(!confirm("Réinitialiser tout votre suivi de progression ? Cette action est irréversible.")) return;
  state = { targets:{}, possede:{}, notes:{}, openSteps:{} };
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  currentView = "dashboard";
  renderAll();
}

// ---------- data helpers ----------
function getTarget(key){
  const t = state.targets[key];
  if(t === undefined || t === null || isNaN(t)) return DATA[key].cible_defaut || 1;
  return t;
}
function setTarget(key, val){
  const n = Math.max(0, parseInt(val,10) || 0);
  state.targets[key] = n;
}
function getPossede(key, si, mi){
  const v = state.possede[key+"|"+si+"|"+mi];
  return (v===undefined||v===null||isNaN(v)) ? 0 : v;
}
function setPossede(key, si, mi, val){
  const n = Math.max(0, parseFloat(val) || 0);
  state.possede[key+"|"+si+"|"+mi] = n;
}
function getNotes(key){
  if(!state.notes[key]) state.notes[key] = {job:"", etape:"", statut:"", notes:"", dateDebut:"", dateCible:""};
  return state.notes[key];
}

function computeRow(key, si, mi, target){
  const m = DATA[key].etapes[si].materiaux[mi];
  const totalRequis = Math.round(m.qte_unite * target * 100)/100;
  const possede = getPossede(key, si, mi);
  const manquant = Math.max(Math.round((totalRequis - possede)*100)/100, 0);
  return {totalRequis, possede, manquant};
}

function stepStatus(key, si){
  const step = DATA[key].etapes[si];
  const target = getTarget(key);
  if(!step.materiaux.length) return {ok:false, requis:0, possede:0, manquant:0};
  let requis=0, possede=0, manquant=0;
  step.materiaux.forEach((m, mi)=>{
    const r = computeRow(key, si, mi, target);
    requis += r.totalRequis;
    possede += Math.min(r.possede, r.totalRequis);
    manquant += r.manquant;
  });
  return {ok: manquant<=0.0001, requis, possede, manquant};
}

function seriesStats(key){
  const steps = DATA[key].etapes;
  let sumRequis=0, sumPossede=0, doneSteps=0;
  steps.forEach((s, si)=>{
    const st = stepStatus(key, si);
    sumRequis += st.requis;
    sumPossede += st.possede;
    if(st.ok) doneSteps++;
  });
  const pct = sumRequis>0 ? Math.round(sumPossede/sumRequis*100) : 0;
  return {pct, doneSteps, totalSteps: steps.length};
}

function globalStats(){
  let sumRequis=0, sumPossede=0, doneSteps=0, totalSteps=0;
  ORDER.forEach(key=>{
    DATA[key].etapes.forEach((s, si)=>{
      const st = stepStatus(key, si);
      sumRequis += st.requis; sumPossede += st.possede;
      if(st.ok) doneSteps++;
      totalSteps++;
    });
  });
  const pct = sumRequis>0 ? Math.round(sumPossede/sumRequis*100) : 0;
  return {pct, doneSteps, totalSteps};
}

function cleanTitle(t){ return t.replace(/^▶\s*/, "").trim(); }
function cleanInstr(t){ return t.replace(/^•\s*/, "").trim(); }

// ---------- rendering ----------
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

function renderRail(){
  const rail = document.getElementById('rail');
  const g = globalStats();
  const ringStyle = `background:conic-gradient(var(--crystal) ${g.pct*3.6}deg, #2a2b3f 0deg)`;
  let navItems = ORDER.map(key=>{
    const s = seriesStats(key);
    const active = currentView===key ? "active" : "";
    return `<li><button class="${active}" data-nav="${key}">
      <div class="nav-top"><span class="nav-name">${DATA[key].titre.split(" (")[0]}</span><span class="nav-ext">${META[key].extension}</span></div>
      <div class="nav-bar"><i id="navbar-${key}" style="width:${s.pct}%"></i></div>
      <div class="nav-pct" id="navpct-${key}">${s.pct}% · ${s.doneSteps}/${s.totalSteps} étapes</div>
    </button></li>`;
  }).join("");

  rail.innerHTML = `
    <div class="brand">
      <div class="mark">Codex des reliques</div>
      <h1 class="serif">Suivi ARR → Dawntrail</h1>
      <p>Votre progression personnelle sur les armes et outils reliques, série par série.</p>
    </div>
    <div class="global-box">
      <div class="global-row">
        <div class="ring" id="globalRing" style="border-radius:50%;${ringStyle}">
          <div style="width:38px;height:38px;border-radius:50%;background:var(--bg-alt);margin:9px;display:flex;align-items:center;justify-content:center;">
            <span class="global-num" id="globalpct">${g.pct}%</span>
          </div>
        </div>
        <div class="global-label">Progression globale<br>${g.doneSteps} / ${g.totalSteps} étapes terminées</div>
      </div>
    </div>
    <ul class="navlist">
      <li><button class="${currentView==='dashboard'?'active':''}" data-nav="dashboard">
        <div class="nav-top"><span class="nav-name">Vue d'ensemble</span></div>
      </button></li>
    </ul>
    <div style="height:10px"></div>
    <ul class="navlist">${navItems}</ul>
    <div class="rail-foot">
      <button class="reset-btn" id="resetBtn">Réinitialiser tout le suivi</button>
      <div class="save-indicator" id="saveIndicator"></div>
    </div>
  `;

  rail.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentView = btn.dataset.nav; renderAll(); window.scrollTo(0,0); });
  });
  document.getElementById('resetBtn').addEventListener('click', resetAll);
}

function renderDashboard(){
  const main = document.getElementById('main');
  const cards = ORDER.map(key=>{
    const s = seriesStats(key);
    const m = META[key];
    return `<div class="dash-card" data-open="${key}">
      <h4 class="serif">${DATA[key].titre.split(" (")[0]}</h4>
      <div class="sub">${m.extension} · ${m.type} · ${m.diff}</div>
      <div class="bar"><i style="width:${s.pct}%"></i></div>
      <div class="foot"><span>${s.doneSteps}/${s.totalSteps} étapes</span><span>${s.pct}%</span></div>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="series-head">
      <div class="eyebrow">Vue d'ensemble</div>
      <h2 class="serif">Toutes les séries de reliques</h2>
      <p style="color:var(--text-dim);font-size:13px;max-width:60ch;line-height:1.6;">
        Neuf séries d'armes et d'outils reliques, de A Realm Reborn à Dawntrail. Cliquez sur une série
        pour saisir votre nombre de jobs ciblés, cocher vos matériaux possédés et suivre chaque étape d'évolution.
      </p>
    </div>
    <div class="dash-grid">${cards}</div>
    <div class="recap-toggle" id="recapToggle">▸ Récapitulatif des matériaux / devises transversales</div>
    <div class="recap-body" id="recapBody">
      <table class="recap-table">
        <thead><tr><th>Matériau / devise</th><th>Séries concernées</th><th>Source principale</th><th>Plafond</th></tr></thead>
        <tbody>
          <tr><td class="n">Allagan Tomestones of Poetics</td><td>Zodiac, Anima, Resistance, Manderville</td><td>Roulettes, raids, contenu endgame</td><td>2000</td></tr>
          <tr><td class="n">White Crafters'/Gatherers' Scrips</td><td>Skysteel, Splendorous</td><td>Livraisons Collectables niveau cap</td><td>4000</td></tr>
          <tr><td class="n">Purple Crafters'/Gatherers' Scrips</td><td>Splendorous (étapes avancées)</td><td>Collectables top tier</td><td>4000</td></tr>
          <tr><td class="n">Skybuilders' Scrips</td><td>Skysteel (étape finale)</td><td>The Diadem</td><td>20000</td></tr>
          <tr><td class="n">FATEs Heavensward (gold)</td><td>Anima, Resistance, Zodiac</td><td>Zones Heavensward, gold medal</td><td>—</td></tr>
          <tr><td class="n">Allagan Tomestones of Mathematics</td><td>Phantom</td><td>Roulettes lvl 100, raids Arcadion</td><td>2000</td></tr>
          <tr><td class="n">Collectables HQ (DoH/DoL)</td><td>Skysteel, Splendorous</td><td>Crafts / récoltes dédiées</td><td>—</td></tr>
        </tbody>
      </table>
    </div>
  `;
  main.querySelectorAll('[data-open]').forEach(c=>{
    c.addEventListener('click', ()=>{ currentView = c.dataset.open; renderAll(); window.scrollTo(0,0); });
  });
  const rt = document.getElementById('recapToggle');
  rt.addEventListener('click', ()=>{
    const body = document.getElementById('recapBody');
    body.classList.toggle('open');
    rt.textContent = (body.classList.contains('open') ? "▾ " : "▸ ") + "Récapitulatif des matériaux / devises transversales";
  });
}

function renderSeries(key){
  const main = document.getElementById('main');
  const sdata = DATA[key];
  const m = META[key];
  const target = getTarget(key);
  const s = seriesStats(key);

  const prereqHtml = sdata.prerequis.length ? `
    <div class="prereqs">
      <div class="lbl">Prérequis pour débuter la série</div>
      <ul>${sdata.prerequis.filter(p=>p.startsWith('•')).map(p=>`<li>${cleanInstr(p)}</li>`).join("") || sdata.prerequis.map(p=>`<li>${p}</li>`).join("")}</ul>
    </div>` : "";

  const stepsHtml = sdata.etapes.map((step, si)=>{
    const st = stepStatus(key, si);
    const open = !!(state.openSteps[key+"|"+si]);
    const questLine = (step.quete && step.quete !== "∅") ? `<span class="step-quest">Quête : ${step.quete}</span>` : "";
    const instrHtml = step.instructions.length ? `<ul class="instr-list">${step.instructions.map(i=>`<li>${cleanInstr(i)}</li>`).join("")}</ul>` : "";
    const matRows = step.materiaux.map((mat, mi)=>{
      const r = computeRow(key, si, mi, target);
      const missingClass = r.manquant<=0.0001 ? "zero" : "some";
      return `<tr>
        <td><div class="mat-name">${mat.nom}</div>${mat.source ? `<div class="mat-source">${mat.source}</div>` : ""}</td>
        <td class="mat-num" id="tot-${key}-${si}-${mi}">${r.totalRequis}</td>
        <td class="mat-num"><input class="mat-input" type="number" min="0" step="1" value="${r.possede}" data-key="${key}" data-si="${si}" data-mi="${mi}"></td>
        <td class="mat-num mat-missing ${missingClass}" id="man-${key}-${si}-${mi}">${r.manquant}</td>
      </tr>`;
    }).join("");
    const notesHtml = step.notes_materiaux ? `<div class="step-notes">${step.notes_materiaux.map(n=>`<div>· ${n}</div>`).join("")}</div>` : "";
    const table = step.materiaux.length ? `
      <table class="mat">
        <thead><tr><th>Matériau / objet</th><th>Requis</th><th>Possédé</th><th>Manquant</th></tr></thead>
        <tbody>${matRows}</tbody>
      </table>
      <div class="step-total" id="steptotal-${key}-${si}">
        <span>Requis : ${st.requis}</span><span>Possédé : ${st.possede}</span><span>Manquant : ${st.manquant}</span>
      </div>` : "";

    return `<div class="step ${st.ok?'ok':''} ${open?'open':''}" id="step-${key}-${si}">
      <div class="step-node"></div>
      <div class="step-card">
        <div class="step-summary" data-toggle="${key}|${si}">
          <div class="step-title">${cleanTitle(step.titre)}${questLine}</div>
          <span class="badge" id="stepbadge-${key}-${si}">${st.ok ? "OK ✓" : "En cours"}</span>
          <span class="chevron">›</span>
        </div>
        <div class="step-body">
          ${instrHtml}
          ${table}
          ${notesHtml}
        </div>
      </div>
    </div>`;
  }).join("");

  const notes = getNotes(key);

  main.innerHTML = `
    <div class="series-head">
      <div class="eyebrow"><button id="backBtn" style="background:none;border:none;color:var(--crystal);cursor:pointer;font-size:12px;padding:0;font-family:inherit;">← Vue d'ensemble</button></div>
      <h2 class="serif">${sdata.titre}</h2>
      <div class="series-meta"><span><b>${m.extension}</b></span><span>${m.type}</span><span>${m.diff}</span></div>
      <div class="target-row">
        <label for="targetInput">Nombre d'armes/outils ciblés</label>
        <input type="number" id="targetInput" min="0" max="24" value="${target}">
        <div class="overall-bar"><i id="seriesbar-${key}" style="width:${s.pct}%"></i></div>
        <span class="overall-pct" id="seriespct-${key}">${s.pct}%</span>
      </div>
    </div>
    ${prereqHtml}
    <div class="timeline">${stepsHtml}</div>

    <div class="suivi">
      <h3>Mon suivi — ${sdata.titre.split(" (")[0]}</h3>
      <p class="hint">Notes personnelles, indépendantes du calcul automatique des matériaux.</p>
      <div class="suivi-grid">
        <div class="suivi-field"><label>Job / métier ciblé</label><input type="text" id="notes-job" value="${notes.job}" placeholder="ex. Paladin, Miner…"></div>
        <div class="suivi-field"><label>Étape actuelle</label><input type="text" id="notes-etape" value="${notes.etape}" placeholder="ex. Étape 3 — Atma"></div>
        <div class="suivi-field"><label>Statut</label>
          <select id="notes-statut">
            <option value="" ${notes.statut===""?"selected":""}>—</option>
            <option value="À faire" ${notes.statut==="À faire"?"selected":""}>À faire</option>
            <option value="En cours" ${notes.statut==="En cours"?"selected":""}>En cours</option>
            <option value="En pause" ${notes.statut==="En pause"?"selected":""}>En pause</option>
            <option value="Terminé" ${notes.statut==="Terminé"?"selected":""}>Terminé</option>
          </select>
        </div>
        <div class="suivi-field"><label>Date de début</label><input type="date" id="notes-debut" value="${notes.dateDebut}"></div>
        <div class="suivi-field"><label>Date cible</label><input type="date" id="notes-cible" value="${notes.dateCible}"></div>
        <div class="suivi-field full"><label>Notes</label><textarea id="notes-notes" placeholder="Vos remarques, farms en cours, etc.">${notes.notes}</textarea></div>
      </div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{ currentView='dashboard'; renderAll(); window.scrollTo(0,0); });

  document.getElementById('targetInput').addEventListener('input', (e)=>{
    setTarget(key, e.target.value);
    updateSeriesNumbers(key);
    scheduleSave();
  });

  main.querySelectorAll('.mat-input').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const {key:k, si, mi} = e.target.dataset;
      setPossede(k, si, mi, e.target.value);
      updateRow(k, si, mi);
      updateStepTotal(k, si);
      updateSeriesNumbers(k);
      scheduleSave();
    });
  });

  main.querySelectorAll('[data-toggle]').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const [k, si] = hdr.dataset.toggle.split("|");
      const stepEl = document.getElementById(`step-${k}-${si}`);
      const openKey = k+"|"+si;
      const isOpen = stepEl.classList.toggle('open');
      state.openSteps[openKey] = isOpen;
      scheduleSave();
    });
  });

  ["job","etape","statut","debut","cible","notes"].forEach(f=>{
    const node = document.getElementById('notes-'+f);
    const field = f==="debut" ? "dateDebut" : f==="cible" ? "dateCible" : f;
    node.addEventListener('input', ()=>{ getNotes(key)[field] = node.value; scheduleSave(); });
    node.addEventListener('change', ()=>{ getNotes(key)[field] = node.value; scheduleSave(); });
  });
}

// ---------- targeted DOM updates (avoid full re-render / focus loss) ----------
function updateRow(key, si, mi){
  const target = getTarget(key);
  const r = computeRow(key, si, mi, target);
  const tot = document.getElementById(`tot-${key}-${si}-${mi}`);
  const man = document.getElementById(`man-${key}-${si}-${mi}`);
  if(tot) tot.textContent = r.totalRequis;
  if(man){
    man.textContent = r.manquant;
    man.classList.toggle('zero', r.manquant<=0.0001);
    man.classList.toggle('some', r.manquant>0.0001);
  }
}

function updateStepTotal(key, si){
  const st = stepStatus(key, si);
  const totalEl = document.getElementById(`steptotal-${key}-${si}`);
  if(totalEl) totalEl.innerHTML = `<span>Requis : ${st.requis}</span><span>Possédé : ${st.possede}</span><span>Manquant : ${st.manquant}</span>`;
  const badge = document.getElementById(`stepbadge-${key}-${si}`);
  if(badge) badge.textContent = st.ok ? "OK ✓" : "En cours";
  const stepEl = document.getElementById(`step-${key}-${si}`);
  if(stepEl) stepEl.classList.toggle('ok', st.ok);
}

function updateSeriesNumbers(key){
  // recompute every row's totals for this series (target changed) then aggregates
  DATA[key].etapes.forEach((step, si)=>{
    step.materiaux.forEach((m, mi)=> updateRow(key, si, mi));
    updateStepTotal(key, si);
  });
  const s = seriesStats(key);
  const bar = document.getElementById(`seriesbar-${key}`);
  const pct = document.getElementById(`seriespct-${key}`);
  if(bar) bar.style.width = s.pct+"%";
  if(pct) pct.textContent = s.pct+"%";
  const navbar = document.getElementById(`navbar-${key}`);
  const navpct = document.getElementById(`navpct-${key}`);
  if(navbar) navbar.style.width = s.pct+"%";
  if(navpct) navpct.textContent = `${s.pct}% · ${s.doneSteps}/${s.totalSteps} étapes`;
  const g = globalStats();
  const gp = document.getElementById('globalpct');
  if(gp) gp.textContent = g.pct+"%";
  const ring = document.getElementById('globalRing');
  if(ring) ring.style.background = `conic-gradient(var(--crystal) ${g.pct*3.6}deg, #2a2b3f 0deg)`;
}

function renderAll(){
  renderRail();
  if(currentView === "dashboard") renderDashboard();
  else renderSeries(currentView);
}

// ---------- boot ----------
(function boot(){
  loadState();
  renderAll();
})();

})();
</script>
</body>
</html>
