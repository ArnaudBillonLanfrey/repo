<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex des Reliques — Suivi ARR → Dawntrail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1620;
  --bg-alt:#101B27;
  --panel:#182433;
  --panel-2:#1E2C3D86;
  --line:#2A3C50;
  --text:#E9EEF2;
  --text-dim:#92A4B2;
  --text-faint:#5E7080;
  --heading:#FFFFFF;
  --crystal:#5EE6D9;
  --crystal-dim:#3A9C92;
  --gold:#E3B34D;
  --gold-dim:#8A6B2C;
  --rose:#E2637A;
  --rose-dim:#7A3540;
  --bg-glow:#192B3B;
  --radius:10px;
}
/* Palettes alternatives — voir le sélecteur "Thème" en bas du menu */
:root[data-theme="allagan"]{
  --bg:#190F22; --bg-alt:#20142B; --panel:#271A34; --panel-2:#2E1F3E86; --line:#3D2A4E;
  --text:#EFE6F7; --text-dim:#AE9CC4; --text-faint:#766487;
  --heading:#F4ECFA;
  --crystal:#B084F5; --crystal-dim:#7C55B8;
  --gold:#E0955A; --gold-dim:#8C5A32;
  --rose:#E15C6B; --rose-dim:#7A3038;
  --bg-glow:#231A33;
}
:root[data-theme="ishgard"]{
  --bg:#0A1620; --bg-alt:#0F1F2C; --panel:#152837; --panel-2:#1C314086; --line:#294356;
  --text:#E9F2F8; --text-dim:#8FA7B8; --text-faint:#5C7488;
  --heading:#F2F8FC;
  --crystal:#6FC3F0; --crystal-dim:#3E80A8;
  --gold:#D9C77A; --gold-dim:#8A7A44;
  --rose:#E36B7A; --rose-dim:#7C3843;
  --bg-glow:#17344A;
}
:root[data-theme="thavnair"]{
  --bg:#1C120D; --bg-alt:#241811; --panel:#2C1F15; --panel-2:#34271B86; --line:#43321F;
  --text:#F5E9D6; --text-dim:#C2A587; --text-faint:#8D7155;
  --heading:#FBF1E0;
  --crystal:#4FBFA8; --crystal-dim:#2F7C6C;
  --gold:#E8B23D; --gold-dim:#8F6C22;
  --rose:#C9525A; --rose-dim:#6E2C30;
  --bg-glow:#2E2014;
}
:root[data-theme="void"]{
  --bg:#07060A; --bg-alt:#0C0A10; --panel:#121018; --panel-2:#17141E86; --line:#241F2E;
  --text:#EAE6F2; --text-dim:#948EA8; --text-faint:#5F5A70;
  --heading:#F2EEF8;
  --crystal:#E056C4; --crystal-dim:#94378C;
  --gold:#D9A34E; --gold-dim:#8A6530;
  --rose:#D9455B; --rose-dim:#752834;
  --bg-glow:#16121C;
}
:root[data-theme="parchemin"]{
  --bg:#F3E9D3; --bg-alt:#EADFC2; --panel:#FBF4E4; --panel-2:#EFE3C680; --line:#D9C9A2;
  --text:#2B2015; --text-dim:#6B5A3E; --text-faint:#96845F;
  --heading:#211A10;
  --crystal:#1F7A6C; --crystal-dim:#154F45;
  --gold:#AD711A; --gold-dim:#7A5012;
  --rose:#A23B3B; --rose-dim:#6E2626;
  --bg-glow:#F7EFDC;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at 20% -10%, var(--bg-glow) 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Cormorant Garamond',serif;}

/* Layout */
.app{display:flex;min-height:100vh;}
.rail{
  width:300px;flex:0 0 300px;
  background:var(--bg-alt);
  border-right:1px solid var(--line);
  padding:28px 18px 18px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.main{flex:1;min-width:0;padding:40px 56px 90px;max-width:1320px;}

/* Grands écrans (24-27") : on donne de l'air au contenu plutôt que de l'étirer platement */
@media(min-width:1500px){
  .rail{width:320px;flex:0 0 320px;padding:36px 22px 22px;}
  .main{padding:52px 72px 110px;max-width:1400px;}
  body{font-size:15.5px;}
  .series-head h2{font-size:40px;}
  table.mat{font-size:13.5px;}
  .step-title{font-size:15.5px;}
}

/* Brand */
.brand{padding:0 6px 22px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.brand .mark{font-size:11px;letter-spacing:.14em;color:var(--crystal);text-transform:uppercase;margin-bottom:6px;}
.brand h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;margin:0 0 4px;line-height:1.15;color:var(--heading);}
.brand p{font-size:12.5px;color:var(--text-dim);margin:0;line-height:1.5;}

/* Global ring */
.global-box{
  margin:0 6px 20px;padding:16px;border-radius:var(--radius);
  background:linear-gradient(160deg,#1d2038,#171827);
  border:1px solid var(--line);
}
.global-row{display:flex;align-items:center;gap:14px;}
.ring{width:56px;height:56px;flex:0 0 56px;}
.global-num{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--crystal);}
.global-label{font-size:11px;color:var(--text-dim);line-height:1.3;}

/* Nav list */
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;}
.navlist button{
  width:100%;text-align:left;border:none;background:transparent;color:var(--text);
  padding:10px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  font-family:inherit;
}
.navlist button:hover{background:var(--panel);}
.navlist button.active{background:var(--panel);box-shadow:inset 2px 0 0 var(--crystal);}
.nav-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.nav-name{font-size:13.5px;font-weight:600;}
.nav-ext{font-size:10.5px;color:var(--text-faint);}
.nav-bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;}
.nav-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--crystal-dim),var(--crystal));}
.nav-pct{font-size:10.5px;color:var(--text-dim);}

.nav-overview{
  width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--crystal-dim);
  background:linear-gradient(135deg, rgba(94,230,217,0.14), rgba(94,230,217,0.03));
  color:var(--text);padding:12px 14px;border-radius:10px;cursor:pointer;font-family:inherit;
  margin-bottom:14px;
}
.nav-overview:hover{background:linear-gradient(135deg, rgba(94,230,217,0.22), rgba(94,230,217,0.06));}
.nav-overview.active{border-color:var(--crystal);box-shadow:0 0 0 1px var(--crystal) inset;}
.nav-overview .ico{
  width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:rgba(94,230,217,0.16);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--crystal);
}
.nav-overview .txt{text-align:left;}
.nav-overview .txt .t1{font-size:13.5px;font-weight:700;color:var(--heading);}
.nav-overview .txt .t2{font-size:10.5px;color:var(--text-dim);}
.nav-group-label{
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);
  margin:14px 6px 6px;font-weight:600;
}
.nav-group-label:first-of-type{margin-top:6px;}
.theme-picker{margin:18px 6px 4px;}
.theme-picker .lbl{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.theme-swatches{display:flex;gap:9px;flex-wrap:wrap;}
.theme-swatch{
  width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  position:relative;flex:0 0 28px;background:transparent;
}
.theme-swatch.active{border-color:var(--heading);}
.theme-swatch span{position:absolute;inset:3px;border-radius:50%;display:block;}
.sync-row{display:flex;gap:8px;margin-bottom:8px;}
.sync-btn{
  flex:1;font-size:11px;color:var(--text-dim);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:8px 4px;cursor:pointer;font-family:inherit;
}
.sync-btn:hover{border-color:var(--crystal-dim);color:var(--crystal);}
.reset-btn{
  width:100%;font-size:11.5px;color:var(--rose);background:transparent;border:1px solid var(--rose-dim);
  border-radius:8px;padding:8px;cursor:pointer;font-family:inherit;
}
.reset-btn:hover{background:rgba(226,99,122,0.08);}
.save-indicator{font-size:10.5px;color:var(--text-faint);text-align:center;margin-top:8px;height:14px;}

/* Series header */
.series-head{margin-bottom:22px;}
.eyebrow{font-size:11px;color:var(--text-dim);letter-spacing:.03em;margin-bottom:6px;}
.series-head h2{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;margin:0 0 8px;color:var(--heading);}
.series-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim);margin-bottom:16px;}
.series-meta b{color:var(--text);font-weight:600;}
.target-row{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  padding:12px 14px;border-radius:var(--radius);margin-bottom:8px;
}
.target-row label{font-size:12.5px;color:var(--text-dim);}
.target-row input{
  width:64px;background:var(--bg-alt);border:1px solid var(--line);color:var(--text);
  border-radius:6px;padding:6px 8px;font-family:inherit;font-size:14px;text-align:center;
}
.overall-bar{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden;}
.overall-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--crystal-dim),var(--gold));}
.overall-pct{font-size:12.5px;color:var(--crystal);min-width:40px;text-align:right;}

/* Prereqs */
.prereqs{
  background:var(--panel-2);border:1px dashed var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:24px;font-size:12.5px;color:var(--text-dim);
}
.prereqs .lbl{color:var(--text);font-weight:600;margin-bottom:6px;font-size:12.5px;}
.prereqs ul{margin:0;padding-left:18px;}
.prereqs li{margin-bottom:3px;}

/* Timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{
  content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1px;
  background:linear-gradient(to bottom, var(--crystal-dim), var(--line));
}
.step{position:relative;margin-bottom:14px;}
.step-node{
  position:absolute;left:-26px;top:16px;width:17px;height:17px;border-radius:50%;
  background:var(--bg-alt);border:2px solid var(--line);
}
.step.ok .step-node{border-color:var(--gold);background:var(--gold);}
.step-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;
}
.step-summary{
  display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;
}
.step-summary:hover{background:#1f2032;}
.step-title{font-size:14.5px;font-weight:600;flex:1;min-width:0;}
.step-quest{font-size:11.5px;color:var(--text-faint);display:block;margin-top:2px;font-weight:400;}
.game-term{font-family:'EB Garamond',serif;font-style:italic;font-weight:600;color:var(--crystal);letter-spacing:.01em;}
.eorzeadb_link{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;cursor:help;}
.eorzeadb_link:hover{border-bottom-style:solid;}
.badge{
  font-size:10.5px;padding:3px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto;
  border:1px solid var(--line);color:var(--text-dim);
}
.step.ok .badge{border-color:var(--gold-dim);color:var(--gold);background:rgba(227,179,77,0.08);}
.chevron{color:var(--text-faint);font-size:13px;transition:transform .15s ease;flex:0 0 auto;}
.step.open .chevron{transform:rotate(90deg);}
.step-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line);}
.step.open .step-body{display:block;}
.instr-list{margin:12px 0 14px;padding-left:18px;font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.instr-list li{margin-bottom:4px;}
.instr-list li::marker{color:var(--crystal-dim);}

table.mat{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
table.mat th{
  text-align:left;font-size:10.5px;color:var(--text-faint);font-weight:600;
  padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.mat td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.mat tr:last-child td{border-bottom:none;}
.mat-name-row{display:flex;align-items:flex-start;gap:9px;}
.mat-icon{
  position:relative;width:22px;height:22px;flex:0 0 22px;border-radius:6px;
  background:var(--bg-alt);border:1px solid var(--line);color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:1px;
}
.mat-icon svg{width:14px;height:14px;}
.mat-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .15s;}
.mat-name{color:var(--text);font-family:'EB Garamond',serif;font-style:italic;font-weight:600;font-size:16px;}
.mat-source{color:var(--text-faint);font-size:11.5px;}
.mat-num{text-align:right;color:var(--text-dim);white-space:nowrap;}
.mat-possede-cell{display:flex;align-items:center;justify-content:flex-end;gap:6px;white-space:nowrap;}

.lang-toggle{display:flex;gap:6px;}
.lang-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg-alt);color:var(--text-dim);cursor:pointer;font-family:inherit;
}
.flag-ico{width:18px;height:12px;border-radius:2px;display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,0.15);flex-shrink:0;}
.lang-btn:hover{border-color:var(--crystal-dim);color:var(--text);}
.lang-btn.active{background:rgba(94,230,217,0.14);border-color:var(--crystal);color:var(--crystal);font-weight:600;}
.job-group-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.job-chips{display:flex;flex-wrap:wrap;gap:6px;}
.job-chip{
  font-size:11.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--bg-alt);color:var(--text-dim);cursor:pointer;font-family:inherit;
}
.job-chip:hover{border-color:var(--crystal-dim);color:var(--text);}
.job-chip.active{background:rgba(94,230,217,0.14);border-color:var(--crystal);color:var(--crystal);}
.job-subblock{margin:14px 0;}
.job-subtitle{font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px;}
.hint-empty{font-size:12px;color:var(--text-faint);font-style:italic;margin:10px 0;}
.mat-missing{font-weight:600;}
.mat-missing.zero{color:var(--gold);}
.mat-missing.some{color:var(--rose);}
.step-total{
  display:flex;justify-content:flex-end;gap:18px;font-size:11.5px;color:var(--text-dim);
  padding:10px 8px 2px;
}
.step-notes{margin-top:10px;font-size:11.5px;color:var(--text-faint);font-style:italic;}
.step-notes div{margin-bottom:3px;}

.dash-section-title{
  font-size:19px;font-weight:600;color:var(--heading);margin:26px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--line);
}
.dash-section-title:first-of-type{margin-top:8px;}
/* Dashboard (accueil) */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;}
@media(min-width:1100px){ .dash-grid{grid-template-columns:1fr 1fr 1fr;} }
.dash-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;transition:border-color .15s;
}
.dash-card:hover{border-color:var(--crystal-dim);}
.dash-card-top{cursor:pointer;}
.dash-card h4{font-family:'Cormorant Garamond',serif;font-size:17px;margin:0 0 3px;color:var(--heading);font-weight:600;}
.dash-card .sub{font-size:11px;color:var(--text-faint);margin-bottom:10px;}
.dash-card .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:6px;}
.dash-card .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--crystal-dim),var(--gold));}
.dash-card .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:12px;}
.dash-target{
  display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);
}
.dash-target label{font-size:10.5px;color:var(--text-faint);flex:1;}

/* Stepper (boutons -/+ ergonomiques) */
.stepper{display:flex;align-items:center;gap:0;flex:0 0 auto;}
.stepper button{
  width:26px;height:26px;flex:0 0 26px;border:1px solid var(--line);background:var(--bg-alt);
  color:var(--text);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;user-select:none;
}
.stepper button:hover{background:var(--panel);border-color:var(--crystal-dim);color:var(--crystal);}
.stepper button:active{background:var(--crystal-dim);color:#0F1019;}
.stepper button.minus{border-radius:6px 0 0 6px;}
.stepper button.plus{border-radius:0 6px 6px 0;}
.stepper input{
  width:44px;height:26px;background:var(--bg-alt);border:1px solid var(--line);border-left:none;border-right:none;
  color:var(--text);text-align:center;font-family:inherit;font-size:13px;padding:0;
}
.stepper.sm button{width:22px;height:22px;flex:0 0 22px;font-size:13px;}
.stepper.sm input{width:40px;height:22px;font-size:12px;}
.max-btn{
  flex:0 0 auto;border:1px solid var(--gold-dim);background:rgba(227,179,77,0.08);color:var(--gold);
  border-radius:6px;font-size:10.5px;padding:4px 8px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.max-btn:hover{background:rgba(227,179,77,0.16);}
.step-fill-btn{
  border:1px solid var(--crystal-dim);background:rgba(94,230,217,0.08);color:var(--crystal);
  border-radius:7px;font-size:11px;padding:6px 10px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.step-fill-btn:hover{background:rgba(94,230,217,0.16);}

.recap-toggle{
  margin-top:26px;font-size:12px;color:var(--crystal);cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;
}
.recap-body{display:none;margin-top:12px;}
.recap-body.open{display:block;}
.recap-table{width:100%;border-collapse:collapse;font-size:12px;}
.recap-table th{text-align:left;color:var(--text-faint);font-weight:600;font-size:10.5px;padding:6px 8px;border-bottom:1px solid var(--line);}
.recap-table td{padding:8px 8px;border-bottom:1px solid var(--line);color:var(--text-dim);}
.recap-table td.n{color:var(--text);font-weight:500;}

@media(max-width:860px){
  .app{flex-direction:column;}
  .rail{position:relative;width:100%;flex:none;height:auto;top:0;}
  .main{padding:24px 18px 60px;max-width:none;}
  .dash-grid{grid-template-columns:1fr;}
}
:focus-visible{outline:2px solid var(--crystal);outline-offset:2px;}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>

    savingTxt:"Saving…", savedTxt:"Progress saved ✓", exportedTxt:"File exported ✓",

  },
};
function t(key, ...args){
  const dict = STR[getLang()] || STR.fr;
  const v = dict[key];
  if(typeof v === "function") return v(...args);
  return v !== undefined ? v : (STR.fr[key] || key);
}

// Bornes réelles fournies par l'utilisateur (paliers de jobs débloqués par extension)
const MAXTARGET = {
  Zodiaque:10, Anima:13, Eureka:15, Resistance:17, Manderville:19, "Fantôme":21,
};

// Séries d'outils DoH/DoL : matériaux spécifiques à chaque métier (pas de multiplicateur générique)
const PER_JOB_SERIES = TOOLS; // les 6 séries d'outils (Craft + Gather) sont toutes par métier
function isPerJobSeries(key){ return PER_JOB_SERIES.includes(key); }
const JOB_LIST_DOH = ["MEN","FRG","ARM","ORF","TAN","COU","ALC","CUI"];
const JOB_LIST_DOL = ["MIN","BOT","PEC"];
const JOB_LIST_ALL = [...JOB_LIST_DOH, ...JOB_LIST_DOL];
const JOB_NAMES_FR = {
  MEN:"Menuisier", FRG:"Forgeron", ARM:"Armurier", ORF:"Orfèvre", TAN:"Tanneur",
  COU:"Couturier", ALC:"Alchimiste", CUI:"Cuisinier", MIN:"Mineur", BOT:"Botaniste", PEC:"Pêcheur",
};

const THEMES = [
  {id:"aetheryte", name:"Aetheryte", c1:"#5EE6D9", c2:"#E3B34D"},
  {id:"allagan",   name:"Allagan",   c1:"#B084F5", c2:"#E0955A"},
  {id:"ishgard",   name:"Ishgard",   c1:"#6FC3F0", c2:"#D9C77A"},
  {id:"thavnair",  name:"Thavnair",  c1:"#4FBFA8", c2:"#E8B23D"},
  {id:"void",      name:"Void",      c1:"#E056C4", c2:"#D9A34E"},
  {id:"parchemin", name:"Parchemin", c1:"#1F7A6C", c2:"#AD711A"},
];
const THEME_KEY = "armes-relique-theme";

const FLAG_FR = `<svg class="flag-ico" viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg"><rect width="1" height="2" x="0" fill="#0055A4"/><rect width="1" height="2" x="1" fill="#FFFFFF"/><rect width="1" height="2" x="2" fill="#EF4135"/></svg>`;
const FLAG_GB = `<svg class="flag-ico" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg"><clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#00247d"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#cf142b" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#cf142b" stroke-width="6"/></svg>`;

function safeGetTheme(){
  try{ return localStorage.getItem(THEME_KEY) || "aetheryte"; }catch(e){ return "aetheryte"; }
}
function applyTheme(id, persist){
  document.documentElement.dataset.theme = (id === "aetheryte") ? "" : id;
  if(persist){
    try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
  }
}

const STORAGE_KEY = "armes-relique-progress";

let state = { targets:{}, possede:{}, notes:{}, openSteps:{}, jobs:{}, lang:"fr" };

function getLang(){ return state.lang || "fr"; }
function setLang(l){ state.lang = l; scheduleSave(); }
function dispName(m){ return (getLang()==="en" && m.nom_en) ? m.nom_en : m.nom; }
function dispQuete(step){
  if(getLang()==="en") return step.quete_en || step.quete || step.quete_fr;
  return step.quete_fr || step.quete;
}
let currentView = "dashboard"; // "dashboard" or a series key
let saveTimer = null;

// ---------- storage (localStorage : natif au navigateur, fonctionne en fichier local ou hébergé) ----------
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign({targets:{}, possede:{}, notes:{}, openSteps:{}, jobs:{}, lang:"fr"}, parsed);
    }
  }catch(e){ /* premier lancement : rien à charger, ou stockage indisponible (navigation privée, etc.) */ }
}

function scheduleSave(){
  clearTimeout(saveTimer);
  const ind = document.getElementById('saveIndicator');
  if(ind) ind.textContent = t("savingTxt");
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if(ind) ind.textContent = t("savedTxt");
      setTimeout(()=>{ if(ind) ind.textContent=""; }, 1800);
    }catch(e){
      if(ind) ind.textContent = "Échec de l'enregistrement (stockage indisponible)";
    }
  }, 300);
}

function exportProgress(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `armes-reliques-progres-${date}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const ind = document.getElementById('saveIndicator');
    if(ind){ ind.textContent = t("exportedTxt"); setTimeout(()=>{ ind.textContent=""; }, 1800); }
  }catch(e){
    alert(t("exportFail"));
  }
}

function importProgress(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(typeof parsed !== "object" || parsed === null) throw new Error("format invalide");
      if(!confirm(t("confirmImport"))) return;
      state = Object.assign({targets:{}, possede:{}, notes:{}, openSteps:{}, jobs:{}, lang:"fr"}, parsed);
      scheduleSave();
      currentView = "dashboard";
      renderAll();
    }catch(err){
      alert(t("invalidImport"));
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function resetAll(){
  if(!confirm(t("confirmReset"))) return;
  state = { targets:{}, possede:{}, notes:{}, openSteps:{}, jobs:{}, lang:"fr" };
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  currentView = "dashboard";
  renderAll();
}

// ---------- data helpers ----------
function getTarget(key){
  const max = MAXTARGET[key] || 24;
  const t = state.targets[key];
  if(t === undefined || t === null || isNaN(t)) return Math.min(max, DATA[key].cible_defaut || 1);
  return Math.min(max, t);
}
function setTarget(key, val){
  const n = Math.max(0, parseInt(val,10) || 0);
  state.targets[key] = n;
}
function getPossede(key, si, mi){
  const v = state.possede[key+"|"+si+"|"+mi];
  return (v===undefined||v===null||isNaN(v)) ? 0 : v;
}
function setPossede(key, si, mi, val){
  const n = Math.max(0, parseFloat(val) || 0);
  state.possede[key+"|"+si+"|"+mi] = n;
}

// ---------- sélection de métiers (séries d'outils DoH/DoL) ----------
function getSelectedJobs(key){
  if(!state.jobs[key]) state.jobs[key] = {};
  return state.jobs[key];
}
function isJobSelected(key, job){ return !!getSelectedJobs(key)[job]; }
function toggleJob(key, job){
  const jobs = getSelectedJobs(key);
  jobs[job] = !jobs[job];
  scheduleSave();
}
function selectedJobCount(key){ return JOB_LIST_ALL.filter(j=>isJobSelected(key,j)).length; }

function getPossedePJ(key, si, job, mi){
  const v = state.possede[key+"|"+si+"|"+job+"|"+mi];
  return (v===undefined||v===null||isNaN(v)) ? 0 : v;
}
function setPossedePJ(key, si, job, mi, val){
  const n = Math.max(0, parseFloat(val) || 0);
  state.possede[key+"|"+si+"|"+job+"|"+mi] = n;
}
function computeRowPJ(key, si, job, mi){
  const m = DATA[key].etapes[si].materiaux_par_job[job][mi];
  const totalRequis = m.qte_unite;
  const possede = getPossedePJ(key, si, job, mi);
  const manquant = Math.max(Math.round((totalRequis - possede)*100)/100, 0);
  return {totalRequis, possede, manquant};
}
function stepStatusPJ(key, si){
  const step = DATA[key].etapes[si];
  const jobs = JOB_LIST_ALL.filter(j => isJobSelected(key, j) && step.materiaux_par_job && step.materiaux_par_job[j]);
  let requis=0, possede=0, manquant=0;
  jobs.forEach(job=>{
    step.materiaux_par_job[job].forEach((m, mi)=>{
      const r = computeRowPJ(key, si, job, mi);
      requis += r.totalRequis;
      possede += Math.min(r.possede, r.totalRequis);
      manquant += r.manquant;
    });
  });
  return {ok: jobs.length>0 && manquant<=0.0001, requis, possede, manquant};
}

// Certaines étapes (Atma, Mahatma) ne se multiplient pas par le nombre d'armes ciblées :
// chaque signe correspond à un métier précis, un seul est nécessaire quel que soit le
// nombre d'armes visées au total.
function totalRequisFor(step, m, target){
  const t = step.fixe ? 1 : target;
  return Math.round(m.qte_unite * t * 100)/100;
}
function computeRow(key, si, mi, target){
  const step = DATA[key].etapes[si];
  const m = step.materiaux[mi];
  const totalRequis = totalRequisFor(step, m, target);
  const possede = getPossede(key, si, mi);
  const manquant = Math.max(Math.round((totalRequis - possede)*100)/100, 0);
  return {totalRequis, possede, manquant};
}

function stepStatus(key, si){
  if(isPerJobSeries(key)) return stepStatusPJ(key, si);
  const step = DATA[key].etapes[si];
  const target = getTarget(key);
  if(!step.materiaux.length) return {ok:false, requis:0, possede:0, manquant:0};
  let requis=0, possede=0, manquant=0;
  step.materiaux.forEach((m, mi)=>{
    const r = computeRow(key, si, mi, target);
    requis += r.totalRequis;
    possede += Math.min(r.possede, r.totalRequis);
    manquant += r.manquant;
  });
  return {ok: manquant<=0.0001, requis, possede, manquant};
}

function seriesStats(key){
  const steps = DATA[key].etapes;
  let sumRequis=0, sumPossede=0, doneSteps=0;
  steps.forEach((s, si)=>{
    const st = stepStatus(key, si);
    sumRequis += st.requis;
    sumPossede += st.possede;
    if(st.ok) doneSteps++;
  });
  const pct = sumRequis>0 ? Math.round(sumPossede/sumRequis*100) : 0;
  return {pct, doneSteps, totalSteps: steps.length};
}

// Matériaux considérés comme "devises transversales" (farmées pour plusieurs séries à la fois)
const CURRENCY_HINTS = ["Tomestone", "Scrip", "Mémoquartz", "mémoquartz"];

function buildCurrencyRecap(){
  const byName = {};
  const add = (key, si, nom, r) => {
    if(!byName[nom]) byName[nom] = {nom, requis:0, possede:0, series:new Set()};
    byName[nom].requis += r.totalRequis;
    byName[nom].possede += Math.min(r.possede, r.totalRequis);
    byName[nom].series.add(DATA[key].titre.split(" (")[0]);
  };
  ORDER.forEach(key=>{
    if(isPerJobSeries(key)){
      DATA[key].etapes.forEach((step, si)=>{
        JOB_LIST_ALL.filter(j=>isJobSelected(key,j) && step.materiaux_par_job && step.materiaux_par_job[j]).forEach(job=>{
          step.materiaux_par_job[job].forEach((m, mi)=>{
            const text = m.nom + " " + (m.nom_en || "");
            if(!CURRENCY_HINTS.some(h=>text.includes(h))) return;
            add(key, si, m.nom, computeRowPJ(key, si, job, mi));
          });
        });
      });
      return;
    }
    const target = getTarget(key);
    DATA[key].etapes.forEach((step, si)=>{
      step.materiaux.forEach((m, mi)=>{
        const text = m.nom + " " + (m.nom_en || "");
        if(!CURRENCY_HINTS.some(h=>text.includes(h))) return;
        add(key, si, m.nom, computeRow(key, si, mi, target));
      });
    });
  });
  return Object.values(byName).map(e=>({
    nom: e.nom,
    series: Array.from(e.series).join(", "),
    requis: Math.round(e.requis*100)/100,
    possede: Math.round(Math.min(e.possede, e.requis)*100)/100,
    manquant: Math.max(Math.round((e.requis - e.possede)*100)/100, 0),
  })).sort((a,b)=> b.manquant - a.manquant);
}

function globalStats(){
  let sumRequis=0, sumPossede=0, doneSteps=0, totalSteps=0;
  ORDER.forEach(key=>{
    DATA[key].etapes.forEach((s, si)=>{
      const st = stepStatus(key, si);
      sumRequis += st.requis; sumPossede += st.possede;
      if(st.ok) doneSteps++;
      totalSteps++;
    });
  });
  const pct = sumRequis>0 ? Math.round(sumPossede/sumRequis*100) : 0;
  return {pct, doneSteps, totalSteps};
}

function cleanTitle(t){ return t.replace(/^▶\s*/, "").trim(); }
function cleanInstr(t){ return t.replace(/^•\s*/, "").trim(); }

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// Surligne (police distincte) les noms de quêtes/objets connus d'une étape quand ils apparaissent dans un paragraphe d'instructions
function highlightTerms(text, terms){
  const uniq = Array.from(new Set((terms||[]).filter(x=>x && x.trim().length>=3).map(x=>x.trim())));
  uniq.sort((a,b)=> b.length - a.length);
  let out = escapeHtml(text);
  uniq.forEach(term=>{
    const esc = escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(esc, "g"), m=>`<span class="game-term">${m}</span>`);
  });
  return out;
}
function stepTerms(step, materiauxLists){
  const terms = [];
  const q = dispQuete(step);
  if(q) terms.push(...q.split(" / ").map(s=>s.trim()));
  (materiauxLists||[]).forEach(list=> list.forEach(m=> terms.push(dispName(m))));
  return terms;
}

// ---------- icônes de matériau (icône générique par défaut, image perso en surcouche si fournie) ----------
function slugify(name){
  let s = name.replace(/\s*\(total\)\s*/i, "");
  s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  s = s.toLowerCase().replace(/'/g, "");
  s = s.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return s;
}
const ICON_CATEGORIES = [
  ["devise", ["tomestone", "scrip"]],
  ["craft", ["crystal", "ore", "ink", "cloth", "sand", "oil", "plate", "fixateur", "parchemin", "bois", "cuir", "fil", "tissu", "etoffe", "bougie", "mortier", "pilon", "bague", "buche"]],
  ["drop", ["mahatma", "atma", "memory", "cluster", "feather", "scale", "francesca", "kingcake", "ear"]],
  ["quete", ["key item", "glass"]],
  ["recolte", ["shard", "fish", "catch", "node", "aetherially reduced"]],
  ["special", ["light", "aether", "cp ", "credit", "research data"]],
];
function classifyMaterial(nom, source){
  const text = (nom + " " + (source||"")).toLowerCase();
  for(const [cat, keys] of ICON_CATEGORIES){
    if(keys.some(k=>text.includes(k))) return cat;
  }
  return "autre";
}

// Correspondance "slug matériau" -> "numéro d'icône brut" (icons/icon-map.json), éditable
// directement sur GitHub sans régénérer l'app. Vide par défaut = fallback sur l'icône générique.
// Icônes + liens Lodestone officiels confirmés — intégrés en dur pour marcher même en local
// (file://) sans attendre le déploiement. icons/icon-map.json (une fois déployé en http(s))
// vient compléter/écraser cette liste avec tes propres ajouts.
// Format par entrée : soit une chaîne (URL d'icône ou numéro local, comme avant),
// soit un objet {icon:"...", link:"..."} si tu as aussi le lien de la page Lodestone
// (le lien active l'info-bulle officielle Fan Kit Tooltip au survol).
let ICON_MAP = {
  "marteau-a-panne-croisee-superstellaire": {
    icon: "https://lds-img.finalfantasyxiv.com/itemicon/6b/6b4d2cd7fb7056e8b19003935875f548a748d110.png",

    icon: "https://lds-img.finalfantasyxiv.com/itemicon/d2/d2de9785220ab36fb3cf438ae4de5633017e56e8.png",
    link: "https://fr.finalfantasyxiv.com/lodestone/playguide/db/item/c2e76099a41",
  },
};
async function loadIconMap(){
  try{
    const res = await fetch("icons/icon-map.json", {cache:"no-store"});
    if(res.ok) ICON_MAP = Object.assign({}, ICON_MAP, await res.json());
  }catch(e){ /* pas de carte dispo (ex: ouverture en local file://) : on garde la liste en dur */ }
  renderAll();
}
function mapEntry(slug){
  const v = ICON_MAP[slug];
  if(v == null) return {icon:null, link:null};
  if(typeof v === "string") return {icon:v, link:null};
  return {icon:v.icon||null, link:v.link||null};
}
// Enrobe un nom de matériau d'un lien Fan Kit Tooltip officiel si on a son URL Lodestone
function matLinkWrap(displayHtml, nom){
  const {link} = mapEntry(slugify(nom));
  if(!link) return displayHtml;
  return `<a href="${link}" class="eorzeadb_link" target="_blank" rel="noopener">${displayHtml}</a>`;
}
function materialIconHtml(nom, source){
  const cat = classifyMaterial(nom, source);
  const slug = slugify(nom);
  const svg = ICON_SVG[cat] || ICON_SVG.autre;
  const {icon: mappedIcon} = mapEntry(slug);
  // mappedIcon peut être une URL complète (icône officielle Lodestone) ou un numéro local (icons/XXXXX.png)
  const imgSrc = mappedIcon
    ? (/^https?:\/\//i.test(mappedIcon) ? mappedIcon : `icons/${mappedIcon}.png`)
    : `icons/${slug}.png`;
  return `<span class="mat-icon" title="${cat}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${svg}</svg>
    <img src="${imgSrc}" alt="" loading="lazy" onload="this.style.opacity=1" onerror="this.remove()">
  </span>`;
}

function bumpTarget(key, delta){
  const max = MAXTARGET[key] || 24;
  const next = Math.min(max, Math.max(0, getTarget(key) + delta));
  state.targets[key] = next;
  scheduleSave();
  return next;
}
function bumpPossede(key, si, mi, delta){
  const target = getTarget(key);
  const r = computeRow(key, si, mi, target);
  const next = Math.max(0, getPossede(key, si, mi) + delta);
  setPossede(key, si, mi, next);
  scheduleSave();
  return next;
}
function setMaxPossede(key, si, mi){
  const target = getTarget(key);
  const step = DATA[key].etapes[si];
  const m = step.materiaux[mi];
  setPossede(key, si, mi, totalRequisFor(step, m, target));

}

}

        <td class="mat-possede-cell">
          <div class="stepper sm">
            <button class="minus" data-mat-minus="${key}|${si}|${mi}" aria-label="Diminuer">−</button>
            <input class="mat-input" type="number" min="0" step="1" value="${r.possede}" data-key="${key}" data-si="${si}" data-mi="${mi}">
            <button class="plus" data-mat-plus="${key}|${si}|${mi}" aria-label="Augmenter">+</button>
          </div>
          <button class="max-btn" data-mat-max="${key}|${si}|${mi}" title="${t("allObtained")}">${t("all")}</button>
        </td>
        <td class="mat-num mat-missing ${missingClass}" id="man-${key}-${si}-${mi}">${r.manquant}</td>
      </tr>`;
    }).join("");
    const notesHtml = step.notes_materiaux ? `<div class="step-notes">${step.notes_materiaux.map(n=>`<div>· ${n}</div>`).join("")}</div>` : "";
    const table = step.materiaux.length ? `
      <table class="mat">
        <thead><tr><th>${t("thMaterial")}</th><th>${t("thRequired")}</th><th>${t("thOwned")}</th><th>${t("thMissing")}</th></tr></thead>
        <tbody>${matRows}</tbody>
      </table>
      <div class="step-total" id="steptotal-${key}-${si}">
        <button class="step-fill-btn" data-step-fill="${key}|${si}">${t("allStepObtained")}</button>
        <span style="flex:1"></span>
        <span>${t("required")} : ${st.requis}</span><span>${t("owned")} : ${st.possede}</span><span>${t("missing")} : ${st.manquant}</span>
      </div>` : "";

    return `<div class="step ${st.ok?'ok':''} ${open?'open':''}" id="step-${key}-${si}">
      <div class="step-node"></div>
      <div class="step-card">
        <div class="step-summary" data-toggle="${key}|${si}">
          <div class="step-title">${cleanTitle(step.titre)}${questLine}</div>
          <span class="badge" id="stepbadge-${key}-${si}">${st.ok ? t("ok") : t("inProgress")}</span>
          <span class="chevron">›</span>
        </div>
        <div class="step-body">
          ${instrHtml}
          ${table}
          ${notesHtml}
        </div>
      </div>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="series-head">
      <div class="eyebrow"><button id="backBtn" style="background:none;border:none;color:var(--crystal);cursor:pointer;font-size:12px;padding:0;font-family:inherit;">${t("back")}</button></div>
      <h2 class="serif">${seriesTitle(key)}</h2>
      <div class="series-meta"><span><b>${m.extension}</b></span><span>${metaType(key)}</span><span>${metaDiff(key)}</span></div>
      <div class="target-row">
        <label for="targetInput">${t("targetLabel", MAXTARGET[key]||24)}</label>
        <div class="stepper">
          <button class="minus" id="targetMinus" aria-label="Diminuer">−</button>
          <input type="number" id="targetInput" min="0" max="${MAXTARGET[key]||24}" value="${target}">
          <button class="plus" id="targetPlus" aria-label="Augmenter">+</button>
        </div>
        <div class="overall-bar"><i id="seriesbar-${key}" style="width:${s.pct}%"></i></div>
        <span class="overall-pct" id="seriespct-${key}">${s.pct}%</span>
      </div>
    </div>
    ${prereqHtml}
    <div class="timeline">${stepsHtml}</div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{ currentView='dashboard'; renderAll(); window.scrollTo(0,0); });

  document.getElementById('targetInput').addEventListener('input', (e)=>{
    const max = MAXTARGET[key] || 24;
    const n = Math.min(max, Math.max(0, parseInt(e.target.value,10) || 0));
    e.target.value = n;
    setTarget(key, n);
    updateSeriesNumbers(key);
    scheduleSave();
  });
  document.getElementById('targetMinus').addEventListener('click', ()=>{
    const n = bumpTarget(key, -1);
    document.getElementById('targetInput').value = n;
    updateSeriesNumbers(key);
  });
  document.getElementById('targetPlus').addEventListener('click', ()=>{
    const n = bumpTarget(key, 1);
    document.getElementById('targetInput').value = n;
    updateSeriesNumbers(key);
  });

  main.querySelectorAll('.mat-input').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const {key:k, si, mi} = e.target.dataset;
      setPossede(k, si, mi, e.target.value);
      updateRow(k, si, mi);
      updateStepTotal(k, si);
      updateSeriesNumbers(k);
      scheduleSave();
    });
  });
  main.querySelectorAll('[data-mat-minus]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [k, si, mi] = btn.dataset.matMinus.split("|");
      const n = bumpPossede(k, si, mi, -1);
      const input = main.querySelector(`.mat-input[data-key="${k}"][data-si="${si}"][data-mi="${mi}"]`);
      if(input) input.value = n;
      updateRow(k, si, mi); updateStepTotal(k, si); updateSeriesNumbers(k);
    });
  });
  main.querySelectorAll('[data-mat-plus]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [k, si, mi] = btn.dataset.matPlus.split("|");
      const n = bumpPossede(k, si, mi, 1);
      const input = main.querySelector(`.mat-input[data-key="${k}"][data-si="${si}"][data-mi="${mi}"]`);
      if(input) input.value = n;
      updateRow(k, si, mi); updateStepTotal(k, si); updateSeriesNumbers(k);
    });
  });
  main.querySelectorAll('[data-mat-max]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [k, si, mi] = btn.dataset.matMax.split("|");
      setMaxPossede(k, si, mi);
      const input = main.querySelector(`.mat-input[data-key="${k}"][data-si="${si}"][data-mi="${mi}"]`);
      const r = computeRow(k, si, mi, getTarget(k));
      if(input) input.value = r.possede;
      updateRow(k, si, mi); updateStepTotal(k, si); updateSeriesNumbers(k);
    });
  });
  main.querySelectorAll('[data-step-fill]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [k, si] = btn.dataset.stepFill.split("|");
      if(fillStepMax(k, si) === false) return;
      DATA[k].etapes[si].materiaux.forEach((m, mi)=>{
        const input = main.querySelector(`.mat-input[data-key="${k}"][data-si="${si}"][data-mi="${mi}"]`);
        const r = computeRow(k, si, mi, getTarget(k));
        if(input) input.value = r.possede;
        updateRow(k, si, mi);
      });
      updateStepTotal(k, si); updateSeriesNumbers(k);
    });
  });

  main.querySelectorAll('[data-toggle]').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const [k, si] = hdr.dataset.toggle.split("|");
      const stepEl = document.getElementById(`step-${k}-${si}`);
      const openKey = k+"|"+si;
      const isOpen = stepEl.classList.toggle('open');
      state.openSteps[openKey] = isOpen;
      scheduleSave();
    });
  });

}

function renderSeriesPerJob(key){
  const main = document.getElementById('main');
  const sdata = DATA[key];
  const m = META[key];
  const s = seriesStats(key);

  const prereqHtml = sdata.prerequis.length ? `
    <div class="prereqs">
      <div class="lbl">${t("prereqs")}</div>
      <ul>${sdata.prerequis.filter(p=>p.startsWith('•')).map(p=>`<li>${cleanInstr(p)}</li>`).join("") || sdata.prerequis.map(p=>`<li>${p}</li>`).join("")}</ul>
    </div>` : "";

  const jobToggles = (group) => group.map(job=>{
    const active = isJobSelected(key, job) ? "active" : "";
    return `<button class="job-chip ${active}" data-job-toggle="${key}|${job}">${jobName(job)}</button>`;
  }).join("");

  const isGather = key.endsWith("Gather");
  const relevantJobs = isGather ? JOB_LIST_DOL : JOB_LIST_DOH;
  const jobSelectorHtml = `
    <div class="target-row" style="flex-direction:column;align-items:stretch;gap:10px;">
      <label>${t("jobsSelectLabel", selectedJobCount(key))}</label>
      <div class="job-group-label">${isGather ? t("gatherGroup") : t("craftGroup")}</div>
      <div class="job-chips">${jobToggles(relevantJobs)}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
        <div class="overall-bar"><i id="seriesbar-${key}" style="width:${s.pct}%"></i></div>
        <span class="overall-pct" id="seriespct-${key}">${s.pct}%</span>
      </div>
    </div>`;

  const selectedJobs = JOB_LIST_ALL.filter(j=>isJobSelected(key, j));

  const stepsHtml = sdata.etapes.map((step, si)=>{
    const st = stepStatus(key, si);
    const open = !!(state.openSteps[key+"|"+si]);
    const questTxt = dispQuete(step);
    const questLine = (questTxt && questTxt !== "∅") ? `<span class="step-quest">${t("quest")} : <span class="game-term">${questTxt}</span></span>` : "";
    const jobsWithMats = selectedJobs.filter(j => step.materiaux_par_job && step.materiaux_par_job[j]);
    const terms = stepTerms(step, jobsWithMats.map(job=>step.materiaux_par_job[job]));
    const instrHtml = step.instructions.length ? `<ul class="instr-list">${step.instructions.map(i=>`<li>${highlightTerms(cleanInstr(i), terms)}</li>`).join("")}</ul>` : "";

    const jobTables = jobsWithMats.length ? jobsWithMats.map(job=>{
      const matRows = step.materiaux_par_job[job].map((mat, mi)=>{
        const r = computeRowPJ(key, si, job, mi);
        const missingClass = r.manquant<=0.0001 ? "zero" : "some";
        return `<tr>
          <td><div class="mat-name-row">${materialIconHtml(mat.nom, mat.source)}<div><div class="mat-name">${matLinkWrap(dispName(mat), mat.nom)}</div>${mat.source ? `<div class="mat-source">${mat.source}</div>` : ""}</div></div></td>
          <td class="mat-num" id="tot-${key}-${si}-${job}-${mi}">${r.totalRequis}</td>
          <td class="mat-possede-cell">
            <div class="stepper sm">
              <button class="minus" data-matpj-minus="${key}|${si}|${job}|${mi}" aria-label="Diminuer">−</button>
              <input class="mat-input-pj" type="number" min="0" step="1" value="${r.possede}" data-key="${key}" data-si="${si}" data-job="${job}" data-mi="${mi}">
              <button class="plus" data-matpj-plus="${key}|${si}|${job}|${mi}" aria-label="Augmenter">+</button>
            </div>
            <button class="max-btn" data-matpj-max="${key}|${si}|${job}|${mi}" title="${t("allObtained")}">${t("all")}</button>
          </td>
          <td class="mat-num mat-missing ${missingClass}" id="man-${key}-${si}-${job}-${mi}">${r.manquant}</td>
        </tr>`;
      }).join("");
      return `<div class="job-subblock">
        <div class="job-subtitle">${jobName(job)} (${job})</div>
        <table class="mat">
          <thead><tr><th>${t("thMaterial")}</th><th>${t("thRequired")}</th><th>${t("thOwned")}</th><th>${t("thMissing")}</th></tr></thead>
          <tbody>${matRows}</tbody>
        </table>
      </div>`;
    }).join("") : `<p class="hint-empty">${t("selectJobHint")}</p>`;

    const table = jobsWithMats.length ? `
      ${jobTables}
      <div class="step-total" id="steptotal-${key}-${si}">
        <span style="flex:1"></span>
        <span>${t("required")} : ${st.requis}</span><span>${t("owned")} : ${st.possede}</span><span>${t("missing")} : ${st.manquant}</span>
      </div>` : jobTables;

    return `<div class="step ${st.ok?'ok':''} ${open?'open':''}" id="step-${key}-${si}">
      <div class="step-node"></div>
      <div class="step-card">
        <div class="step-summary" data-toggle="${key}|${si}">
          <div class="step-title">${cleanTitle(step.titre)}${questLine}</div>
          <span class="badge" id="stepbadge-${key}-${si}">${st.ok ? t("ok") : t("inProgress")}</span>
          <span class="chevron">›</span>
        </div>
        <div class="step-body">
          ${instrHtml}
          ${table}
        </div>
      </div>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="series-head">
      <div class="eyebrow"><button id="backBtn" style="background:none;border:none;color:var(--crystal);cursor:pointer;font-size:12px;padding:0;font-family:inherit;">${t("back")}</button></div>
      <h2 class="serif">${seriesTitle(key)}</h2>
      <div class="series-meta"><span><b>${m.extension}</b></span><span>${metaType(key)}</span><span>${metaDiff(key)}</span></div>
      ${jobSelectorHtml}
    </div>
    ${prereqHtml}
    <div class="timeline">${stepsHtml}</div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{ currentView='dashboard'; renderAll(); window.scrollTo(0,0); });

  main.querySelectorAll('[data-job-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [k, job] = btn.dataset.jobToggle.split("|");
      toggleJob(k, job);
      renderSeriesPerJob(k);
    });
  });

  main.querySelectorAll('.mat-input-pj').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const {key:k, si, job, mi} = e.target.dataset;
      setPossedePJ(k, si, job, mi, e.target.value);
      updateRowPJ(k, si, job, mi);
      updateStepTotal(k, si);
      updateSeriesNumbersPJ(k);
      scheduleSave();
    });
  });
  main.querySelectorAll('[data-matpj-minus]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [k, si, job, mi] = btn.dataset.matpjMinus.split("|");
      const cur = getPossedePJ(k, si, job, mi);
      setPossedePJ(k, si, job, mi, Math.max(0, cur-1));
      const input = main.querySelector(`.mat-input-pj[data-key="${k}"][data-si="${si}"][data-job="${job}"][data-mi="${mi}"]`);
      if(input) input.value = getPossedePJ(k, si, job, mi);
      updateRowPJ(k, si, job, mi); updateStepTotal(k, si); updateSeriesNumbersPJ(k); scheduleSave();
    });
  });
  main.querySelectorAll('[data-matpj-plus]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [k, si, job, mi] = btn.dataset.matpjPlus.split("|");
      const cur = getPossedePJ(k, si, job, mi);
      setPossedePJ(k, si, job, mi, cur+1);
      const input = main.querySelector(`.mat-input-pj[data-key="${k}"][data-si="${si}"][data-job="${job}"][data-mi="${mi}"]`);
      if(input) input.value = getPossedePJ(k, si, job, mi);
      updateRowPJ(k, si, job, mi); updateStepTotal(k, si); updateSeriesNumbersPJ(k); scheduleSave();
    });
  });
  main.querySelectorAll('[data-matpj-max]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [k, si, job, mi] = btn.dataset.matpjMax.split("|");
      const m = DATA[k].etapes[si].materiaux_par_job[job][mi];
      setPossedePJ(k, si, job, mi, m.qte_unite);
      const input = main.querySelector(`.mat-input-pj[data-key="${k}"][data-si="${si}"][data-job="${job}"][data-mi="${mi}"]`);
      if(input) input.value = m.qte_unite;
      updateRowPJ(k, si, job, mi); updateStepTotal(k, si); updateSeriesNumbersPJ(k); scheduleSave();
    });
  });

  main.querySelectorAll('[data-toggle]').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const [k, si] = hdr.dataset.toggle.split("|");
      const stepEl = document.getElementById(`step-${k}-${si}`);
      const isOpen = stepEl.classList.toggle('open');
      state.openSteps[k+"|"+si] = isOpen;
      scheduleSave();
    });
  });
}

function updateRowPJ(key, si, job, mi){
  const r = computeRowPJ(key, si, job, mi);
  const tot = document.getElementById(`tot-${key}-${si}-${job}-${mi}`);
  const man = document.getElementById(`man-${key}-${si}-${job}-${mi}`);
  if(tot) tot.textContent = r.totalRequis;
  if(man){
    man.textContent = r.manquant;
    man.classList.toggle('zero', r.manquant<=0.0001);
    man.classList.toggle('some', r.manquant>0.0001);
  }
}

function updateSeriesNumbersPJ(key){
  const s = seriesStats(key);
  const bar = document.getElementById(`seriesbar-${key}`);
  const pct = document.getElementById(`seriespct-${key}`);
  if(bar) bar.style.width = s.pct+"%";
  if(pct) pct.textContent = s.pct+"%";
  const navbar = document.getElementById(`navbar-${key}`);
  const navpct = document.getElementById(`navpct-${key}`);
  if(navbar) navbar.style.width = s.pct+"%";
  if(navpct) navpct.textContent = `${s.pct}% · ${s.doneSteps}/${s.totalSteps} ${t("steps")}`;
  const g = globalStats();
  const gp = document.getElementById('globalpct');
  if(gp) gp.textContent = g.pct+"%";
  const ring = document.getElementById('globalRing');
  if(ring) ring.style.background = `conic-gradient(var(--crystal) ${g.pct*3.6}deg, #2a2b3f 0deg)`;
}

// ---------- targeted DOM updates (avoid full re-render / focus loss) ----------
function updateRow(key, si, mi){
  const target = getTarget(key);
  const r = computeRow(key, si, mi, target);
  const tot = document.getElementById(`tot-${key}-${si}-${mi}`);
  const man = document.getElementById(`man-${key}-${si}-${mi}`);
  if(tot) tot.textContent = r.totalRequis;
  if(man){
    man.textContent = r.manquant;
    man.classList.toggle('zero', r.manquant<=0.0001);
    man.classList.toggle('some', r.manquant>0.0001);
  }
}

function updateStepTotal(key, si){
  const st = stepStatus(key, si);
  const totalEl = document.getElementById(`steptotal-${key}-${si}`);
  if(totalEl) totalEl.innerHTML = `<span>${t("required")} : ${st.requis}</span><span>${t("owned")} : ${st.possede}</span><span>${t("missing")} : ${st.manquant}</span>`;
  const badge = document.getElementById(`stepbadge-${key}-${si}`);
  if(badge) badge.textContent = st.ok ? t("ok") : t("inProgress");
  const stepEl = document.getElementById(`step-${key}-${si}`);
  if(stepEl) stepEl.classList.toggle('ok', st.ok);
}

function updateSeriesNumbers(key){
  // recompute every row's totals for this series (target changed) then aggregates
  DATA[key].etapes.forEach((step, si)=>{
    step.materiaux.forEach((m, mi)=> updateRow(key, si, mi));
    updateStepTotal(key, si);
  });
  const s = seriesStats(key);
  const bar = document.getElementById(`seriesbar-${key}`);
  const pct = document.getElementById(`seriespct-${key}`);
  if(bar) bar.style.width = s.pct+"%";
  if(pct) pct.textContent = s.pct+"%";
  const navbar = document.getElementById(`navbar-${key}`);
  const navpct = document.getElementById(`navpct-${key}`);
  if(navbar) navbar.style.width = s.pct+"%";
  if(navpct) navpct.textContent = `${s.pct}% · ${s.doneSteps}/${s.totalSteps} ${t("steps")}`;
  const g = globalStats();
  const gp = document.getElementById('globalpct');
  if(gp) gp.textContent = g.pct+"%";
  const ring = document.getElementById('globalRing');
  if(ring) ring.style.background = `conic-gradient(var(--crystal) ${g.pct*3.6}deg, #2a2b3f 0deg)`;
}

function renderAll(){
  renderRail();
  if(currentView === "dashboard") renderDashboard();
  else renderSeries(currentView);
}

// ---------- boot ----------
(function boot(){
  applyTheme(safeGetTheme(), false);
  loadState();
  renderAll();
  loadIconMap(); // re-rendu silencieux une fois la carte d'icônes chargée (si présente)
})();

})();
</script>
<script src="https://lds-img.finalfantasyxiv.com/pc/global/js/eorzeadb/loader.js?v3" async></script>
</body>
</html>
